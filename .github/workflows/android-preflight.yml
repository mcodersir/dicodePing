name: Android 4.9.7 preflight
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 27
    - uses: android-actions/setup-android@v4
    - name: Install SDK and NDK
      run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
    - name: Restore pinned Android native payloads
      id: android-native
      uses: actions/cache/restore@v5
      with:
        path: |
          apps/android/app/libs
          apps/android/app/src/main/assets/fox
          apps/android/app/src/main/assets/geo*.dat
          apps/android/app/src/main/assets/psiphon_servers.*
        key: ${{ runner.os }}-dicode-native-v1-${{ hashFiles('scripts/runtime-pins-4.9.7.json', 'scripts/stage-*.py', 'scripts/build-android-core.sh', 'scripts/patches/**', 'apps/fox-helper/**', '.github/workflows/android-preflight.yml', '.github/workflows/release.yml') }}
    - name: Build pinned hev TUN
      if: steps.android-native.outputs.cache-hit != 'true'
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      run: |
        git config --global http.version HTTP/1.1
        for attempt in 1 2 3 4; do
          if git clone --branch 2.3.12-P67 --depth 1 https://github.com/patterniha/PattNG.git native-upstream; then
            break
          fi
          rm -rf native-upstream
          test "$attempt" -lt 4
          sleep $((attempt * 5))
        done
        test "$(git -C native-upstream rev-parse HEAD)" = "89c760cee27051ac7b6c391d376e528adfdc8a0c"
        for attempt in 1 2 3 4; do
          if git -C native-upstream submodule update --init --recursive --depth 1; then
            break
          fi
          test "$attempt" -lt 4
          sleep $((attempt * 5))
        done
        git -C native-upstream/hev-socks5-tunnel fetch --depth 1 origin refs/tags/2.19.1
        git -C native-upstream/hev-socks5-tunnel checkout --detach FETCH_HEAD
        test "$(git -C native-upstream/hev-socks5-tunnel rev-parse HEAD)" = "107a5083cb33d729a476c8282745dfc2f12e48e2"
        git -C native-upstream/hev-socks5-tunnel submodule update --init --recursive --depth 1
        bash native-upstream/compile-hevtun.sh
        cp -r native-upstream/libs apps/android/app/
    - name: Bundle verified Android Aether and Psiphon helpers
      if: steps.android-native.outputs.cache-hit != 'true'
      run: |
        python scripts/stage-aether.py --android --output apps/android/app/libs
        bash native-upstream/fetch-psiphon-servers.sh
        cp native-upstream/V2rayNG/app/src/main/assets/psiphon_servers.* apps/android/app/src/main/assets/
    - name: Build Fox helper for all Android architectures
      if: steps.android-native.outputs.cache-hit != 'true'
      run: python scripts/stage-fox.py --android --output apps/android/app/libs
    - name: Bundle verified Android sing-box
      if: steps.android-native.outputs.cache-hit != 'true'
      run: python scripts/stage-singbox-android.py
    - name: Build pinned Android runtime with strict HTTP probes
      if: steps.android-native.outputs.cache-hit != 'true'
      run: bash scripts/build-android-core.sh
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
    - name: Save verified Android native payloads
      if: steps.android-native.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          apps/android/app/libs
          apps/android/app/src/main/assets/fox
          apps/android/app/src/main/assets/geo*.dat
          apps/android/app/src/main/assets/psiphon_servers.*
        key: ${{ runner.os }}-dicode-native-v1-${{ hashFiles('scripts/runtime-pins-4.9.7.json', 'scripts/stage-*.py', 'scripts/build-android-core.sh', 'scripts/patches/**', 'apps/fox-helper/**', '.github/workflows/android-preflight.yml', '.github/workflows/release.yml') }}
    - name: Compile and test Android before release
      env:
        POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
      working-directory: apps/android
      run: |-
        python3 ../../scripts/check-pool-sources.py "$POOL_LIVE_FIXTURES"
        chmod +x gradlew
        ./gradlew testFdroidDebugUnitTest assembleFdroidDebug compileFdroidDebugAndroidTestKotlin --no-daemon -PdicodeVersion=4.9.7
    - name: Enable hardware acceleration for the test emulator
      run: |
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
    - name: Test D-pad traversal and activation on Android emulator
      timeout-minutes: 15
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        disable-animations: true
        working-directory: apps/android
        script: |
          trap 'adb logcat -d > app/build/remote-test-logcat.txt' EXIT; ./gradlew connectedFdroidDebugAndroidTest --no-daemon -PABI_FILTERS=x86_64
    - name: Test native executables and probes on 16 KB Android
      timeout-minutes: 15
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis_ps16k
        arch: x86_64
        disable-animations: true
        working-directory: apps/android
        script: |
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          ./gradlew connectedFdroidDebugAndroidTest --no-daemon -PABI_FILTERS=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.v2ray.ang.core.FoxNativeTest
    - name: Preserve Android test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-test-diagnostics
        path: |
          apps/android/app/build/reports/tests/
          apps/android/app/build/reports/androidTests/
          apps/android/app/build/outputs/androidTest-results/
          apps/android/app/build/remote-test-logcat.txt
'on':
  push:
    branches:
    - codex/release-4.9.7
