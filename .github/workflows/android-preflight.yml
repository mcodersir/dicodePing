name: Android 4.4 preflight
on:
  push:
    branches:
    - codex/release-4.4.0
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - uses: android-actions/setup-android@v4
    - name: Install SDK and NDK
      run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
    - name: Build pinned hev TUN
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      run: "git config --global http.version HTTP/1.1\nfor attempt in 1 2 3 4; do\n  if git clone --branch 2.3.10-P63 --depth 1 https://github.com/patterniha/PattNG.git\
        \ native-upstream; then\n    break\n  fi\n  rm -rf native-upstream\n  test \"$attempt\" -lt 4\n  sleep $((attempt * 5))\ndone\ntest \"$(git -C native-upstream\
        \ rev-parse HEAD)\" = \"d50168fbcb03daf12706096fb0391347b93d172d\"\nfor attempt in 1 2 3 4; do\n  if git -C native-upstream submodule update --init\
        \ --recursive --depth 1; then\n    break\n  fi\n  test \"$attempt\" -lt 4\n  sleep $((attempt * 5))\ndone\nbash native-upstream/compile-hevtun.sh\n\
        cp -r native-upstream/libs apps/android/app/\n"
    - name: Bundle verified Android Aether and Psiphon helpers
      run: 'python scripts/stage-aether.py --android --output apps/android/app/libs

        bash native-upstream/fetch-psiphon-servers.sh

        cp native-upstream/V2rayNG/app/src/main/assets/psiphon_servers.* apps/android/app/src/main/assets/

        '
    - name: Fetch the verified Android Xray runtime
      run: 'mkdir -p apps/android/app/libs

        CORE_TAG="v26.10.10"

        test "$(git -C native-upstream/AndroidLibXrayLite rev-parse HEAD)" = "807361655e622aab42decd0cebc3b047f66cbee7"

        test -n "$CORE_TAG"

        curl -L --fail --retry 4 -o apps/android/app/libs/libv2ray.aar "https://github.com/patterniha/AndroidLibXrayLite/releases/download/$CORE_TAG/libv2ray.aar"

        echo "33a1dc21022ad4e2c31296a43876b857a9623131a92a60d56ae831690ffc8130  apps/android/app/libs/libv2ray.aar" | sha256sum -c -

        '
    - name: Compile and test Android before release
      env:
        POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
      working-directory: apps/android
      run: 'python3 ../../scripts/check-pool-sources.py "$POOL_LIVE_FIXTURES"

        chmod +x gradlew

        ./gradlew testFdroidDebugUnitTest assembleFdroidDebug --no-daemon -PdicodeVersion=4.4.0'

    - name: Enable hardware acceleration for the test emulator
      run: |
        test -c /dev/kvm
        sudo chmod a+rw /dev/kvm
    - name: Test D-pad traversal and activation on Android emulator
      timeout-minutes: 15
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        disable-animations: true
        working-directory: apps/android
        script: |
          trap 'adb logcat -d > app/build/remote-test-logcat.txt' EXIT; ./gradlew connectedFdroidDebugAndroidTest --no-daemon -PABI_FILTERS=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.v2ray.ang.ui.main.RemoteNavigationTest,com.v2ray.ang.ui.main.MainActivityRemoteTest
    - name: Preserve Android test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-test-diagnostics
        path: |
          apps/android/app/build/reports/tests/
          apps/android/app/build/reports/androidTests/
          apps/android/app/build/outputs/androidTest-results/
          apps/android/app/build/remote-test-logcat.txt
