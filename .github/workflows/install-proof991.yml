name: Verify signed 4.9.991 upgrades including archived 4.9.985
'on':
  push:
    branches: [codex/install-proof-4.9.991]
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, apkAbi: x86_64, alternate: universal, target: default, baseline: "4.9.92 4.9.98 4.9.982 4.9.983 4.9.985 4.9.99"}
          - {api: 35, apkAbi: arm64-v8a, alternate: universal, target: google_apis, baseline: "4.9.92 4.9.98 4.9.982 4.9.983 4.9.985 4.9.99"}
          - {api: 36, apkAbi: arm64-v8a, alternate: universal, target: google_apis, baseline: "4.9.92 4.9.98 4.9.982 4.9.983 4.9.985 4.9.99"}
          - {api: 36, apkAbi: universal, alternate: arm64-v8a, target: google_apis, baseline: "4.9.92 4.9.98 4.9.982 4.9.983 4.9.985 4.9.99"}
          - {api: 35, apkAbi: x86_64, alternate: universal, target: google_apis_ps16k, baseline: ""}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require unchanged tested application and installation verifier
        run: git diff --exit-code 2d223dc47a9c3e8b71072d722830a870ffff302e -- apps scripts/verify-android-installation.py scripts/verify-release-apks.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist-android
          run-id: 42329122070
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
      - uses: android-actions/setup-android@v4
      - name: Download and verify every official upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download-upgrade-baselines.py --abi '${{ matrix.apkAbi }}' --versions '${{ matrix.baseline }}' --destination install-check
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test actual release installation, retained data and startup
        env:
          DICODE_INSTALL_TARGET: ${{ matrix.target }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 4096M
          disable-animations: true
          script: python3 scripts/verify-android-installation.py --version 4.9.991 --code 45999100 --baselines ${{ matrix.baseline }} --candidate dist-android/DicodePing-4.9.991-${{ matrix.apkAbi }}.apk --alternate dist-android/DicodePing-4.9.991-${{ matrix.alternate }}.apk
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-installation-${{ matrix.api }}-${{ matrix.apkAbi }}-${{ matrix.target }}
          path: |
            install-check/installation-results.json
            install-check/package-manager-logcat.txt
  tv-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require unchanged tested application and installation verifier
        run: git diff --exit-code 2d223dc47a9c3e8b71072d722830a870ffff302e -- apps scripts/verify-android-installation.py scripts/verify-release-apks.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist-android
          run-id: 42329122070
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
      - uses: android-actions/setup-android@v4
      - run: sudo chmod a+rw /dev/kvm
      - name: Download and verify every official TV baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/download-upgrade-baselines.py --abi tv-universal --versions '4.9.98 4.9.985 4.9.99' --destination install-check
      - name: Launch signed TV build on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 36 TV revision 1 crashes SystemUI before our APK is installed
          # (VectorDrawable resource inflation), leaving every app without focus.
          # Use the stable Android 14 TV image for the signed remote-control gate.
          api-level: 34
          arch: x86
          target: android-tv
          profile: tv_1080p
          # Use GLES in the headless TV guest after its observed restart.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          ram-size: 4096M
          disable-animations: true
          script: python3 scripts/verify-android-installation.py --package ir.dicode.ping.tv --remote --no-data-fixture --version 4.9.991 --code 45999100 --baselines 4.9.98 4.9.985 4.9.99 --candidate dist-android/DicodePing-4.9.991-tv-universal.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-installation-evidence
          path: install-check/
  publish:
    needs: [install, tv-install]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 2d223dc47a9c3e8b71072d722830a870ffff302e
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: '{android,windows-x64,linux-x64,macos-x64,macos-arm64}'
        merge-multiple: true
        run-id: 42329122070
        github-token: ${{ github.token }}
    - name: Require source and Android device checks for this exact commit
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: 2d223dc47a9c3e8b71072d722830a870ffff302e
      run: |
        for attempt in $(seq 1 60); do
          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$RELEASE_SHA&per_page=30" --jq '.workflow_runs')
          result=$(echo "$runs" | jq -r '
            [".github/workflows/ci.yml", ".github/workflows/android-preflight.yml"] as $required |
            [$required[] as $path | [.[] | select(.path == $path)][0] // {status:"pending"}] |
            if any(.[]; .status == "completed" and .conclusion != "success") then "failed"
            elif all(.[]; .status == "completed" and .conclusion == "success") then "passed"
            else "pending" end')
          if [ "$result" = passed ]; then exit 0; fi
          if [ "$result" = failed ]; then echo "Source/device checks failed; release will not be published."; exit 1; fi
          sleep 30
        done
        echo "Source/device checks did not complete; no release tag was created."
        exit 1
    - name: Create the immutable tag only after successful builds
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: 2d223dc47a9c3e8b71072d722830a870ffff302e
      run: |
        if gh api repos/${{ github.repository }}/git/ref/tags/v4.9.991 > tag-ref.json 2> tag-ref-error.txt; then
          existing=$(jq -r '.object.sha' tag-ref.json)
          if [ "$existing" != "$RELEASE_SHA" ]; then
            echo "Release tag points to another commit; refusing to replace it."
            exit 1
          fi
        elif jq -e '.status == "404" or .status == 404' tag-ref.json > /dev/null; then
          gh api --method POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/v4.9.991 -f sha="$RELEASE_SHA"
        else
          cat tag-ref-error.txt
          exit 1
        fi
    - uses: softprops/action-gh-release@v2
      id: draft_release
      with:
        tag_name: v4.9.991
        target_commitish: 2d223dc47a9c3e8b71072d722830a870ffff302e
        name: DicodePing 4.9.991 — Stable
        draft: true
        prerelease: false
        make_latest: false
        generate_release_notes: false
        body_path: docs/RELEASE-4.9.991.md
        files: artifacts/*
    - name: Verify every uploaded package before publishing the stable release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }} > release-metadata.json
        gh release download v4.9.991 --repo "${{ github.repository }}" --pattern 'SHA256SUMS-*.txt' --dir release-checksums --clobber
        python - <<'PYVERIFY'
        import json, pathlib, re
        release = json.loads(pathlib.Path('release-metadata.json').read_text())
        assets = {a['name']: a for a in release['assets']}
        expected = {'DicodePing-4.9.991-' + suffix for suffix in re.findall('data-asset="([^"]+)"', pathlib.Path('web/index.html').read_text())}
        assert len(expected) == 16 and len(assets) == 25 and expected <= assets.keys()
        checks = {}
        for file in pathlib.Path('release-checksums').glob('SHA256SUMS-*.txt'):
            for line in file.read_text(encoding='utf-8-sig').splitlines():
                match = re.fullmatch(r'([0-9a-fA-F]{64})\s+\*?(.+)', line.strip())
                assert match, (file, line)
                checks[match[2]] = match[1].lower()
        assert set(checks) == expected
        for name in expected:
            assert assets[name]['size'] > 0 and assets[name]['digest'] == 'sha256:' + checks[name], name
        print('All 16 packages and 9 checksum files verified; safe to publish.')
        PYVERIFY
        gh api --method PATCH repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }} -F draft=false -f make_latest=true > /dev/null
