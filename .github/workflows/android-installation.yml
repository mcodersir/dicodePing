name: Verify published Android installation
on:
  push:
    branches: [codex/fix-4.9.2-installation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, apkAbi: x86_64, target: default}
          - {api: 36, apkAbi: x86_64, target: default}
          - {api: 35, apkAbi: arm64-v8a, target: google_apis}
          - {api: 36, apkAbi: arm64-v8a, target: google_apis}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Download the actual published packages
        run: |
          mkdir -p install-check
          for version in 4.8.0 4.9.0 4.9.1 4.9.2; do
            curl --fail --location --retry 3 "https://github.com/mcodersir/dicodePing/releases/download/v$version/DicodePing-$version-${{ matrix.apkAbi }}.apk" --output "install-check/$version.apk"
          done
          yes | sdkmanager 'build-tools;37.0.0'
          for apk in install-check/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$apk.signature.txt"
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" > "$apk.manifest.txt"
          done
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test signed release installation and upgrades
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: python3 scripts/verify-android-installation.py
      - name: Preserve package manager evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-installation-api-${{ matrix.api }}-${{ matrix.apkAbi }}
          path: install-check/
