name: Release dicodePing v2.0.0-rc.1

on:
  push:
    tags:
      - "v2.0.0-rc.1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2.0.0-rc.1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/prepare_build_workspace.py
          python tools/verify_version.py --tag v2.0.0-rc.1
          python tools/validate_android_gradle_kts.py
          python tools/validate_android_source_references.py
          python tools/validate_v200_rc1.py
          python -m pytest -q
          python tools/quality_gate.py
          python dicodePing_android/tools/validate_project.py

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/build_windows.py --skip-install
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "dicodeping-v200-rc1-smoke"
          $env:LOCALAPPDATA = $env:APPDATA
          $env:DICODEPING_DISCOVERY_SMOKE = "1"
          $env:DICODEPING_STARTUP_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP "windows-smoke.txt"
          $arguments = @(
            "--startup-smoke-test",
            "--discovery-smoke",
            "--startup-smoke-report=$env:DICODEPING_STARTUP_SMOKE_REPORT"
          )
          $process = Start-Process -FilePath "release/dicodePing-v2.0.0-rc.1-windows-x64.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:DICODEPING_STARTUP_SMOKE_REPORT) { Get-Content $env:DICODEPING_STARTUP_SMOKE_REPORT }
            throw "Packaged Windows smoke test failed: $($process.ExitCode)"
          }
          $reportContent = Get-Content -Raw $env:DICODEPING_STARTUP_SMOKE_REPORT
          Write-Host $reportContent
          if ($reportContent -notmatch 'font_family=Vazirmatn') {
            throw "Packaged Windows build did not resolve Vazirmatn"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/dicodePing-v2.0.0-rc.1-windows-x64.exe
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/build_linux.py --skip-install
          mkdir -p "$RUNNER_TEMP/dicodeping-v200-rc1-smoke"
          tar -xzf release/dicodePing-v2.0.0-rc.1-linux-x86_64.tar.gz -C "$RUNNER_TEMP/dicodeping-v200-rc1-smoke"
          binary="$RUNNER_TEMP/dicodeping-v200-rc1-smoke/dicodePing-v2.0.0-rc.1-linux-x86_64/dicodePing"
          report="$RUNNER_TEMP/linux-smoke.txt"
          env QT_QPA_PLATFORM=offscreen XDG_CONFIG_HOME="$RUNNER_TEMP/dicodeping-config" DICODEPING_DISCOVERY_SMOKE=1 DICODEPING_STARTUP_SMOKE_REPORT="$report" timeout 45s "$binary" --startup-smoke-test --discovery-smoke "--startup-smoke-report=$report"
          cat "$report"
          grep -Fq 'font_family=Vazirmatn' "$report"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/dicodePing-v2.0.0-rc.1-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          # The builder retries transient DiskImages EBUSY failures internally.
          # This outer retry also recovers if the runner-level hdiutil service
          # remains temporarily wedged after a complete build attempt.
          for attempt in 1 2 3; do
            if python tools/build_macos.py --skip-install; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "macOS build failed after three complete attempts" >&2
              exit 1
            fi
            echo "Transient macOS packaging failure; rebuilding in $((attempt * 15)) seconds"
            rm -rf build/dicodePing-v2.0.0-rc.1-macos-*-dmg build/dicodeping-dmg-* dist/dicodePing.app
            rm -f release/dicodePing-v2.0.0-rc.1-macos-*.dmg
            sync || true
            sleep $((attempt * 15))
          done
          test -s "release/dicodePing-v2.0.0-rc.1-macos-${{ matrix.architecture }}.dmg"
          hdiutil verify "release/dicodePing-v2.0.0-rc.1-macos-${{ matrix.architecture }}.dmg"
          app_binary="dist/dicodePing.app/Contents/MacOS/dicodePing"
          report="$RUNNER_TEMP/macos-${{ matrix.architecture }}-smoke.txt"
          test -x "$app_binary"
          env QT_QPA_PLATFORM=offscreen XDG_CONFIG_HOME="$RUNNER_TEMP/dicodeping-macos-config" DICODEPING_STARTUP_SMOKE_REPORT="$report" "$app_binary" --startup-smoke-test "--startup-smoke-report=$report"
          cat "$report"
          grep -Fq 'font_family=Vazirmatn' "$report"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}
          path: release/dicodePing-v2.0.0-rc.1-macos-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dicodePing_android
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/dicodePing_android/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - run: |
          set -euo pipefail
          stale_controller="app/src/main/java/ir/dicode/ping/vpn/AndroidTetheringController.kt"
          if [ -e "$stale_controller" ]; then
            echo "Removing stale common-source AndroidTetheringController that conflicts with product flavors"
            rm -f "$stale_controller"
          fi
          test -f app/src/standard/java/ir/dicode/ping/vpn/AndroidTetheringController.kt
          test -f app/src/rooted/java/ir/dicode/ping/vpn/AndroidTetheringController.kt
          python ../tools/validate_android_gradle_kts.py
          python ../tools/validate_android_source_references.py
          python tools/validate_project.py

          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

          # build_apk.sh itself prepares Aether + Usque, fetches/verifies
          # libv2ray, assembles the signed APK and inspects the final ZIP.
          # This keeps native-core packaging mandatory for every release build.
          chmod +x gradlew build_apk.sh
          ./build_apk.sh

          apk="release/dicodePing-v2.0.0-rc.1-android.apk"
          zipalign_bin="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$zipalign_bin"
          "$zipalign_bin" -c -P 16 -v 4 "$apk"
          if unzip -Z1 "$apk" | grep -Eq '^lib/(armeabi-v7a|x86)/'; then
            echo "32-bit native libraries are not allowed in the 2.0 RC1 public APK" >&2
            exit 1
          fi
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/.*\.so$'
          unzip -Z1 "$apk" | grep -q '^lib/x86_64/.*\.so$'
          for abi in arm64-v8a x86_64; do
            unzip -Z1 "$apk" | grep -q "^lib/$abi/libgojni.so$"
            unzip -Z1 "$apk" | grep -q "^lib/$abi/libaether.so$"
            unzip -Z1 "$apk" | grep -q "^lib/$abi/libusque.so$"
          done
          python tools/verify_apk_cores.py "$apk"
          for font in regular medium bold; do
            unzip -Z1 "$apk" | grep -Eq "^res/.*/vazirmatn_${font}\.ttf$"
          done
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            dicodePing_android/app/build/reports/lint-results-*.html
            dicodePing_android/app/build/reports/lint-results-*.txt
            dicodePing_android/app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dicodePing_android/release/dicodePing-v2.0.0-rc.1-android.apk
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    env:
      PSIPHON_CLIENT_CONFIG_B64: ${{ secrets.PSIPHON_CLIENT_CONFIG_B64 }}
      PSIPHON_CLIENT_CONFIG_SIGNATURE: ${{ secrets.PSIPHON_CLIENT_CONFIG_SIGNATURE }}
      PSIPHON_SPONSOR_ID: ${{ secrets.PSIPHON_SPONSOR_ID }}
      PSIPHON_PROPAGATION_CHANNEL_ID: ${{ secrets.PSIPHON_PROPAGATION_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/windows/* artifacts/linux/* artifacts/android/* release-assets/
          cp artifacts/macos-arm64/* artifacts/macos-x86_64/* release-assets/
          cp assets/core-manifest.json release-assets/core-manifest.json
          cp docs/releases/v2.0.0-rc.1.md release-assets/RELEASE_NOTES.md
          cp CHANGELOG.md THIRD_PARTY_NOTICES.md release-assets/
          python tools/generate_sbom.py
          cp artifacts/SBOM.spdx.json release-assets/SBOM.spdx.json
          git archive --format=zip --output=release-assets/source.zip HEAD

          # 2.0 RC1 bundles Xray, Aether and Usque inside each platform artifact.
          # No separate core archives are published.

          # Psiphon remains disabled unless a future same-package authorized build is available.

          printf '{"repository":"%s","commit":"%s","runId":"%s","workflow":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > release-assets/provenance.json
          (cd release-assets && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0-rc.1
          target_commitish: ${{ github.sha }}
          name: dicodePing v2.0.0-rc.1
          body_path: docs/releases/v2.0.0-rc.1.md
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
