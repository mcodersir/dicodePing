name: Release v4

on:
  push:
    tags: ['v4.*']
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            xray_asset: Xray-windows-64.zip
            xray_sha256: b17a619343c11b89d8faf36278298856749b15c52277d875d32051b33dcda617
            xray_binary: xray.exe
            mihomo_asset: mihomo-windows-amd64-v1-v1.19.32.zip
            mihomo_binary: mihomo.exe
            mihomo_sha256: 00549b347d8e124600e46cac67d59293358454f465e9d86d2511567da56b7029
            singbox_asset: sing-box-1.14.2-windows-amd64.zip
            singbox_binary: sing-box.exe
            singbox_sha256: c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32
            artifact: windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            xray_asset: Xray-linux-64.zip
            xray_sha256: f851110beaff16e78d643f0ccfd9524b4a44dfd59bae3e34bb52bba378f7690e
            xray_binary: xray
            mihomo_asset: mihomo-linux-amd64-v1-v1.19.32.gz
            mihomo_binary: mihomo
            mihomo_sha256: 306f81e723e60ce6b828899a6fe83e1d00e9ecefb2dc8d4d849312a5bc00efdc
            singbox_asset: sing-box-1.14.2-linux-amd64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6
            artifact: linux-x64
          - runner: macos-14
            rid: osx-x64
            xray_asset: Xray-macos-64.zip
            xray_sha256: 1f366aaf21d3c3003d1556d066c4e08f9dd62d1f96555ecedde85b397df0f684
            xray_binary: xray
            mihomo_asset: mihomo-darwin-amd64-v1-v1.19.32.gz
            mihomo_binary: mihomo
            mihomo_sha256: f6eef841308b682e48f9c3e4740af42f5644a53d2f18c4d4bf1ee6f8a7af7c8b
            singbox_asset: sing-box-1.14.2-darwin-amd64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: b0bfb0dc70a5fc708710b9f5ea98b9ee76d40fa4169928d25d73edc4331df2fe
            artifact: macos-x64
          - runner: macos-14
            rid: osx-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            xray_sha256: 4b363bd924df5bf09f87bd445755ff8e5742b9a8a0480cda261061416c3c7dce
            xray_binary: xray
            mihomo_asset: mihomo-darwin-arm64-v1.19.32.gz
            mihomo_binary: mihomo
            mihomo_sha256: 3312a6780652c622890fd4357c6a853bbf865464fd047ac7b7f52dab8de18652
            singbox_asset: sing-box-1.14.2-darwin-arm64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: 925c5382eca8492b0150f868a6db20b18290a38700e621724b3703fd453e032d
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and build the independent desktop client
        run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=4.0.4
      - name: Run desktop regression tests on isolated Windows
        if: runner.os == 'Windows'
        env:
          POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
        run: |
          python scripts/check-pool-sources.py "$env:POOL_LIVE_FIXTURES"
          if ($LASTEXITCODE -ne 0) { throw 'Could not capture Telegram source fixtures' }
          dotnet test apps/desktop/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
      - name: Publish DicodePing desktop
        run: dotnet publish apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=4.0.4 -o publish
      - name: Bundle verified Xray and sing-box runtimes
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/download/v26.9.30/${{ matrix.xray_asset }}"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          $expected = '${{ matrix.xray_sha256 }}'
          $actual = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected) { throw "Xray SHA-256 verification failed" }
          Expand-Archive xray.zip -DestinationPath xray-runtime -Force
          if (-not (Test-Path "xray-runtime/${{ matrix.xray_binary }}")) { throw "Xray binary missing from archive" }
          $xrayDir = New-Item -ItemType Directory -Force publish/bin/xray
          $xray = Get-ChildItem xray-runtime -Recurse -File -Filter '${{ matrix.xray_binary }}' | Select-Object -First 1
          if ($null -eq $xray) { throw "Xray binary missing from archive" }
          Copy-Item $xray.FullName "$xrayDir/${{ matrix.xray_binary }}" -Force
          # Routing rules such as geosite:google need Xray's data files beside
          # the executable root. Without these files the main TUN core cannot
          # start, even though temporary speed-test cores appear to work.
          $dataDir = New-Item -ItemType Directory -Force publish/bin
          foreach ($dataName in @('geosite.dat', 'geoip.dat')) {
            $dataFile = Get-ChildItem xray-runtime -Recurse -File -Filter $dataName | Select-Object -First 1
            if ($null -eq $dataFile) { throw "$dataName missing from Xray archive" }
            Copy-Item $dataFile.FullName "$dataDir/$dataName" -Force
          }
          # Replace the archive defaults with the newest verified routing
          # database release so both the bundled runtime and Geo updater agree.
          $geoRelease = '202610042206'
          $geoHashes = @{ 'geoip.dat' = '391b522361c52804e486a98b53d97f3d9c1d3e4e4217bb34954774a0b456b9fd'; 'geosite.dat' = 'd4e197147c1017129a906a7f155050ccde0b291cf376f787071af3e805cc7d2c' }
          foreach ($dataName in @('geoip.dat', 'geosite.dat')) {
            $geoUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$geoRelease/$dataName"
            Invoke-WebRequest -Uri $geoUrl -OutFile "publish/bin/$dataName"
            $geoActual = (Get-FileHash "publish/bin/$dataName" -Algorithm SHA256).Hash.ToLower()
            if ($geoActual -ne $geoHashes[$dataName]) { throw "$dataName SHA-256 verification failed" }
          }
          $mihomoUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/${{ matrix.mihomo_asset }}"
          Invoke-WebRequest -Uri $mihomoUrl -OutFile mihomo.archive
          $mihomoActual = (Get-FileHash mihomo.archive -Algorithm SHA256).Hash.ToLower()
          if ($mihomoActual -ne '${{ matrix.mihomo_sha256 }}') { throw "Mihomo SHA-256 verification failed" }
          $mihomoDir = New-Item -ItemType Directory -Force publish/bin/mihomo
          if ('${{ matrix.mihomo_asset }}'.EndsWith('.zip')) {
            Expand-Archive mihomo.archive -DestinationPath mihomo-runtime -Force
            $mihomo = Get-ChildItem mihomo-runtime -Recurse -File | Where-Object { $_.Name -like 'mihomo*.exe' } | Select-Object -First 1
            if ($null -eq $mihomo) { throw "Mihomo binary missing from archive" }
            Copy-Item $mihomo.FullName "$mihomoDir/${{ matrix.mihomo_binary }}" -Force
          } else {
            $input = [IO.File]::OpenRead((Resolve-Path mihomo.archive))
            try {
              $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
              try {
                $output = [IO.File]::Create((Join-Path $mihomoDir.FullName '${{ matrix.mihomo_binary }}'))
                try { $gzip.CopyTo($output) } finally { $output.Dispose() }
              } finally { $gzip.Dispose() }
            } finally { $input.Dispose() }
          }
          $singboxUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.14.2/${{ matrix.singbox_asset }}"
          Invoke-WebRequest -Uri $singboxUrl -OutFile sing-box.archive
          $singboxActual = (Get-FileHash sing-box.archive -Algorithm SHA256).Hash.ToLower()
          if ($singboxActual -ne '${{ matrix.singbox_sha256 }}') { throw "sing-box SHA-256 verification failed" }
          New-Item -ItemType Directory -Force sing-box-runtime | Out-Null
          if ('${{ matrix.singbox_asset }}'.EndsWith('.zip')) {
            Expand-Archive sing-box.archive -DestinationPath sing-box-runtime -Force
          } else {
            tar -xzf sing-box.archive -C sing-box-runtime
          }
          $singbox = Get-ChildItem sing-box-runtime -Recurse -File -Filter '${{ matrix.singbox_binary }}' | Select-Object -First 1
          if ($null -eq $singbox) { throw "sing-box binary missing from archive" }
          $singboxDir = New-Item -ItemType Directory -Force publish/bin/sing_box
          Copy-Item $singbox.FullName "$singboxDir/${{ matrix.singbox_binary }}" -Force
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/xray/${{ matrix.xray_binary }}" }
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/sing_box/${{ matrix.singbox_binary }}" }
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/mihomo/${{ matrix.mihomo_binary }}" }
      - name: Execute bundled cores in the ephemeral runner
        shell: pwsh
        run: |
          & (Resolve-Path "publish/bin/xray/${{ matrix.xray_binary }}") version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Xray runtime failed its smoke test' }
          & (Resolve-Path "publish/bin/sing_box/${{ matrix.singbox_binary }}") version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sing-box runtime failed its smoke test' }
          & (Resolve-Path "publish/bin/mihomo/${{ matrix.mihomo_binary }}") -v
          if ($LASTEXITCODE -ne 0) { throw 'Bundled mihomo runtime failed its smoke test' }
      - name: Archive and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/DicodePing-4.0.4-${{ matrix.artifact }}-portable.zip"
          Compress-Archive -Path publish/* -DestinationPath $archive -CompressionLevel Optimal
          "{0}  {1}" -f (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower(), (Split-Path $archive -Leaf) | Set-Content "dist/SHA256SUMS-${{ matrix.artifact }}.txt"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .github\installer\DicodePing.iss
          $installer = Get-Item dist\DicodePing-4.0.4-windows-x64-installer.exe
          Add-Content dist\SHA256SUMS-windows-x64.txt ("{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower(), $installer.Name)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install SDK and NDK
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Build pinned hev TUN
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            if git clone --branch 2.3.10-P60 --depth 1 https://github.com/patterniha/PattNG.git native-upstream; then
              break
            fi
            rm -rf native-upstream
            test "$attempt" -lt 4
            sleep $((attempt * 5))
          done
          test "$(git -C native-upstream rev-parse HEAD)" = "7dbdf0cfc2971709b4d47f202a66e05e974ca1c9"
          for attempt in 1 2 3 4; do
            if git -C native-upstream submodule update --init --recursive --depth 1; then
              break
            fi
            test "$attempt" -lt 4
            sleep $((attempt * 5))
          done
          bash native-upstream/compile-hevtun.sh
          cp -r native-upstream/libs apps/android/app/
      - name: Fetch the libv2ray pinned by PattNG P60
        run: |
          mkdir -p apps/android/app/libs
          CORE_TAG="v26.10.4"
          test "$(git -C native-upstream/AndroidLibXrayLite rev-parse HEAD)" = "dc2d0b1388808fa10916fd212907befd6723e553"
          test -n "$CORE_TAG"
          curl -L --fail --retry 4 -o apps/android/app/libs/libv2ray.aar "https://github.com/patterniha/AndroidLibXrayLite/releases/download/$CORE_TAG/libv2ray.aar"
          echo "086e7c3e74c0d0e5365215b0e17597b4b8449741fb0655b141879dd4420b074f  apps/android/app/libs/libv2ray.aar" | sha256sum -c -
      - name: Build signed installable APKs
        env:
          POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
          DICODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DICODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DICODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/android
        run: |
          python3 ../../scripts/check-pool-sources.py "$POOL_LIVE_FIXTURES"
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > dicodeping-release.jks
          export DICODE_KEYSTORE_PATH="$PWD/dicodeping-release.jks"
          chmod +x gradlew
          ./gradlew testFdroidDebugUnitTest assembleFdroidRelease --no-daemon -PdicodeVersion=4.0.4
      - name: Stage APK and checksums
        run: |
          mkdir -p dist-android
          find apps/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist-android/ \;
          # AGP may keep the internal compatibility flavor in the generated
          # filename; never expose that implementation detail in releases.
          for apk in dist-android/*-fdroid-*.apk; do
            [ -e "$apk" ] || continue
            clean="$(printf '%s' "$apk" | sed 's/-fdroid-/-/')"
            mv "$apk" "$clean"
          done
          cd dist-android
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist-android/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: DicodePing 4.0.4 — Pre-release
          prerelease: true
          generate_release_notes: false
          body: |
            ## DicodePing 4.0.4 — Pre-release

            پیش‌نمایش 4.0.4 با تمرکز روی رفع مشکلات اتصال و گزارش‌گیری، بر اساس لاگ‌های واقعی کاربران نسخه 4.0.3.

            - رفع قطع شدن اتصال: پیکربندی‌های دارای «ویژگی اضافی» خراب از اشتراک دیگر کل اتصال را نمی‌بندند؛ مقدار نامعتبر حذف و سرور با تنظیمات پایه وصل می‌شود.
            - رفع خطای ERR_QUIC_PROTOCOL_ERROR در مرورگر: QUIC (UDP 443) در حالت TUN مسدود می‌شود تا مرورگر به TCP/TLS برگردد.
            - صفحه گزارش‌ها بازطراحی کامل شد: ثبت واقعی همه رویدادها و خروجی هسته، با نشان رنگی سطح لاگ (INFO/ERROR/DEBUG) و فیلتر زنده.
            - بررسی تحریم کاملاً بازنویسی شد: ۲۲ سرویس (یوتیوب، نتفلیکس، چت‌جی‌پی‌تی، Docker Hub و…) با منطق دقیق «سرویس‌های سخت‌گیرانه»؛ نتیجه نام سرویس‌های مسدودشده را هم نشان می‌دهد.
            - مدیریت سرویس‌های بررسی تحریم از تنظیمات: افزودن/ویرایش/حذف/غیرفعال‌سازی (دسکتاپ) و لیست دقیق‌تر در اندروید.
            - رفع فیلتر دامنه در حالت TUN: آدرس‌های paste شده و پیشوندهای full:/regexp:/geosite:/keyword: درست پردازش می‌شوند.
            - تراز متن فارسی در جملات ترکیبی با انگلیسی اصلاح شد (علامت‌های جهت RTL).
            - تم تیره با طیف خاکستری (#141414 / #1F1F1F / #242629) طبق سلیقه کاربران.
            - mihomo v1.19.32 در بسته است (آخرین نسخه پایدار).

            English summary:
            - Connection fixes: invalid subscription extras no longer block the core; they are stripped with a warning.
            - QUIC (UDP 443) is rejected in TUN mode so browsers fall back to TCP/TLS (fixes ERR_QUIC_PROTOCOL_ERROR).
            - Reports page rebuilt: every event and core output is recorded with colored level badges and live filtering.
            - Sanctions check rewritten: 22 services with strict-service gating, failed-service names in the result, and a full management dialog in desktop settings.
            - Domain filter fixed in TUN mode (URLs and full:/regexp:/geosite:/keyword: entries now work).
            - Persian bidi alignment fixed in mixed-language strings (RLM marks).
            - Dark theme switched to neutral grays (#141414 / #1F1F1F / #242629).
            - Bundled mihomo v1.19.32; Android versionCode 400401. Pick DicodePing-4.0.4-universal.apk (or arm64-v8a) for installation.
          files: artifacts/*
