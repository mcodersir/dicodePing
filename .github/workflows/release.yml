name: Release v3

on:
  push:
    tags: ['v3.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            xray_asset: Xray-windows-64.zip
            xray_binary: xray.exe
            singbox_asset: sing-box-1.13.19-windows-amd64.zip
            singbox_binary: sing-box.exe
            singbox_sha256: e011a4def2f5e2b143ed54adb2b1a20a6be407806ab4442f3667f1dd817a2c8d
            artifact: windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            xray_asset: Xray-linux-64.zip
            xray_binary: xray
            singbox_asset: sing-box-1.13.19-linux-amd64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: ef88a9e577d474210867bd708933d042e9b70106529df2656182c9db90106aa1
            artifact: linux-x64
          - runner: macos-14
            rid: osx-x64
            xray_asset: Xray-macos-64.zip
            xray_binary: xray
            singbox_asset: sing-box-1.13.19-darwin-amd64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: 31ee722237d95774e101fbffeae6be6776249c5f7db229ad8ff00b45b22e6a00
            artifact: macos-x64
          - runner: macos-14
            rid: osx-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            xray_binary: xray
            singbox_asset: sing-box-1.13.19-darwin-arm64.tar.gz
            singbox_binary: sing-box
            singbox_sha256: 23bf191906f2dfc9f00e9f0092f274f3426ba9377327e903ff94e636b64d0997
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and build the independent desktop client
        run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=3.0.0
      - name: Publish DicodePing desktop
        run: dotnet publish apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=3.0.0 -o publish
      - name: Bundle verified Xray and sing-box runtimes
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/${{ matrix.xray_asset }}"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Invoke-WebRequest -Uri "$url.dgst" -OutFile xray.zip.dgst
          $expected = ((Get-Content xray.zip.dgst | Select-String '^SHA2-256=\s+([0-9a-f]{64})$').Matches.Groups[1].Value).ToLower()
          $actual = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected) { throw "Xray SHA-256 verification failed" }
          Expand-Archive xray.zip -DestinationPath xray-runtime -Force
          if (-not (Test-Path "xray-runtime/${{ matrix.xray_binary }}")) { throw "Xray binary missing from archive" }
          $xrayDir = New-Item -ItemType Directory -Force publish/bin/xray
          $xray = Get-ChildItem xray-runtime -Recurse -File -Filter '${{ matrix.xray_binary }}' | Select-Object -First 1
          if ($null -eq $xray) { throw "Xray binary missing from archive" }
          Copy-Item $xray.FullName "$xrayDir/${{ matrix.xray_binary }}" -Force
          # Routing rules such as geosite:google need Xray's data files beside
          # the executable root. Without these files the main TUN core cannot
          # start, even though temporary speed-test cores appear to work.
          $dataDir = New-Item -ItemType Directory -Force publish/bin
          foreach ($dataName in @('geosite.dat', 'geoip.dat')) {
            $dataFile = Get-ChildItem xray-runtime -Recurse -File -Filter $dataName | Select-Object -First 1
            if ($null -eq $dataFile) { throw "$dataName missing from Xray archive" }
            Copy-Item $dataFile.FullName "$dataDir/$dataName" -Force
          }
          $singboxUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/${{ matrix.singbox_asset }}"
          Invoke-WebRequest -Uri $singboxUrl -OutFile sing-box.archive
          $singboxActual = (Get-FileHash sing-box.archive -Algorithm SHA256).Hash.ToLower()
          if ($singboxActual -ne '${{ matrix.singbox_sha256 }}') { throw "sing-box SHA-256 verification failed" }
          New-Item -ItemType Directory -Force sing-box-runtime | Out-Null
          if ('${{ matrix.singbox_asset }}'.EndsWith('.zip')) {
            Expand-Archive sing-box.archive -DestinationPath sing-box-runtime -Force
          } else {
            tar -xzf sing-box.archive -C sing-box-runtime
          }
          $singbox = Get-ChildItem sing-box-runtime -Recurse -File -Filter '${{ matrix.singbox_binary }}' | Select-Object -First 1
          if ($null -eq $singbox) { throw "sing-box binary missing from archive" }
          $singboxDir = New-Item -ItemType Directory -Force publish/bin/sing_box
          Copy-Item $singbox.FullName "$singboxDir/${{ matrix.singbox_binary }}" -Force
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/xray/${{ matrix.xray_binary }}" }
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/sing_box/${{ matrix.singbox_binary }}" }
      - name: Archive and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/DicodePing-3.0.0-${{ matrix.artifact }}-portable.zip"
          Compress-Archive -Path publish/* -DestinationPath $archive -CompressionLevel Optimal
          "{0}  {1}" -f (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower(), (Split-Path $archive -Leaf) | Set-Content "dist/SHA256SUMS-${{ matrix.artifact }}.txt"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .github\installer\DicodePing.iss
          $installer = Get-Item dist\DicodePing-3.0.0-windows-x64-installer.exe
          Add-Content dist\SHA256SUMS-windows-x64.txt ("{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower(), $installer.Name)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install SDK and NDK
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Build pinned hev TUN
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          git clone --branch 2.3.4-P26 --depth 1 --recurse-submodules --shallow-submodules https://github.com/patterniha/PattNG.git native-upstream
          bash native-upstream/compile-hevtun.sh
          cp -r native-upstream/libs apps/android/app/
      - name: Fetch pinned libv2ray
        run: |
          mkdir -p apps/android/app/libs
          curl -L --fail --retry 4 -o apps/android/app/libs/libv2ray.aar https://github.com/patterniha/AndroidLibXrayLite/releases/download/v26.8.19-P/libv2ray.aar
      - name: Build installable prerelease APKs
        env:
          DICODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DICODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DICODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/android
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > dicodeping-release.jks
          export DICODE_KEYSTORE_PATH="$PWD/dicodeping-release.jks"
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon -PdicodeVersion=3.0.0
      - name: Stage APK and checksums
        run: |
          mkdir -p dist-android
          find apps/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist-android/ \;
          # AGP may keep the internal compatibility flavor in the generated
          # filename; never expose that implementation detail in releases.
          for apk in dist-android/*-fdroid-*.apk; do
            [ -e "$apk" ] || continue
            clean="$(printf '%s' "$apk" | sed 's/-fdroid-/-/')"
            mv "$apk" "$clean"
          done
          cd dist-android
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist-android/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: false
          body: |
            ## DicodePing 3.0.0 Stable

            DicodePing با هویت مستقل، اجرای اجباری Administrator و TUN-only؛ بدون نام‌های قدیمی در رابط، فایل‌های خروجی و فرایند به‌روزرسانی.

            - دریافت خودکار Subscription پیش‌فرض، تست مسیر واقعی و مرتب‌سازی سریع‌ترین کانفیگ‌ها در شروع
            - اتصال هوشمند واکنش‌گرا با انتخاب گرهٔ برتر و دو دکمهٔ آیکونی اتصال
            - Xray 26.3.27 و sing-box 1.13.19 همراه تمام بسته‌های دسکتاپ، با کنترل SHA-256
            - APK امضاشده و قابل ارتقا، بررسی به‌روزرسانی از GitHub

            | Platform | Portable / direct | Installer / package |
            | --- | --- | --- |
            | Windows x64 | `DicodePing-3.0.0-windows-x64-portable.zip` | `DicodePing-3.0.0-windows-x64-installer.exe` |
            | Linux x64 | `DicodePing-3.0.0-linux-x64-portable.zip` | — |
            | macOS Intel | `DicodePing-3.0.0-macos-x64-portable.zip` | — |
            | macOS Apple Silicon | `DicodePing-3.0.0-macos-arm64-portable.zip` | — |
            | Android | APKهای Universal و تفکیک‌شدهٔ ABI | — |

            فایل‌های `SHA256SUMS-*` برای کنترل صحت دانلودها موجودند. این نسخه پایدار است.
          files: artifacts/*
