name: Release v3

on:
  push:
    tags: ['v3.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            xray_asset: Xray-windows-64.zip
            xray_binary: xray.exe
            artifact: windows-x64
          - runner: ubuntu-latest
            rid: linux-x64
            xray_asset: Xray-linux-64.zip
            xray_binary: xray
            artifact: linux-x64
          - runner: macos-14
            rid: osx-x64
            xray_asset: Xray-macos-64.zip
            xray_binary: xray
            artifact: macos-x64
          - runner: macos-14
            rid: osx-arm64
            xray_asset: Xray-macos-arm64-v8a.zip
            xray_binary: xray
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and build the independent desktop client
        run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=3.0.0-pre.4
      - name: Publish DicodePing desktop
        run: dotnet publish apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=3.0.0-pre.4 -o publish
      - name: Bundle pinned Xray runtime
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/download/v26.7.28/${{ matrix.xray_asset }}"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Invoke-WebRequest -Uri "$url.dgst" -OutFile xray.zip.dgst
          $expected = ((Get-Content xray.zip.dgst | Select-String '^SHA2-256=\s+([0-9a-f]{64})$').Matches.Groups[1].Value).ToLower()
          $actual = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected) { throw "Xray SHA-256 verification failed" }
          Expand-Archive xray.zip -DestinationPath xray-runtime -Force
          if (-not (Test-Path "xray-runtime/${{ matrix.xray_binary }}")) { throw "Xray binary missing from archive" }
          New-Item -ItemType Directory -Force publish/bin | Out-Null
          Copy-Item xray-runtime/* publish/bin -Recurse -Force
          if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/${{ matrix.xray_binary }}" }
      - name: Archive and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/DicodePing-3.0.0-pre.4-${{ matrix.artifact }}-portable.zip"
          Compress-Archive -Path publish/* -DestinationPath $archive -CompressionLevel Optimal
          "{0}  {1}" -f (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower(), (Split-Path $archive -Leaf) | Set-Content "dist/SHA256SUMS-${{ matrix.artifact }}.txt"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .github\installer\DicodePing.iss
          $installer = Get-Item dist\DicodePing-3.0.0-pre.4-windows-x64-installer.exe
          Add-Content dist\SHA256SUMS-windows-x64.txt ("{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower(), $installer.Name)
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install SDK and NDK
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Build pinned hev TUN
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: |
          git clone --branch 2.3.4-P26 --depth 1 --recurse-submodules --shallow-submodules https://github.com/patterniha/PattNG.git native-upstream
          bash native-upstream/compile-hevtun.sh
          cp -r native-upstream/libs apps/android/app/
      - name: Fetch pinned libv2ray
        run: |
          mkdir -p apps/android/app/libs
          curl -L --fail --retry 4 -o apps/android/app/libs/libv2ray.aar https://github.com/patterniha/AndroidLibXrayLite/releases/download/v26.8.19-P/libv2ray.aar
      - name: Build installable prerelease APKs
        env:
          DICODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DICODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DICODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/android
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > dicodeping-release.jks
          export DICODE_KEYSTORE_PATH="$PWD/dicodeping-release.jks"
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon -PdicodeVersion=3.0.0-pre.4
      - name: Stage APK and checksums
        run: |
          mkdir -p dist-android
          find apps/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} dist-android/ \;
          cd dist-android
          sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist-android/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body: |
            ## DicodePing 3.0.0 Pre 4

            DicodePing با هویت مستقل، اجرای اجباری Administrator و TUN-only؛ بدون نام v2rayN در محصول و خروجی‌ها.

            - به‌روزرسانی خودکار Subscription پیش‌فرض در شروع
            - تست مسیر واقعی و مرتب‌سازی سریع‌ترین کانفیگ‌ها
            - دکمه‌های آیکونی اتصال دستی/هوشمند با وضعیت درحال بررسی
            - APK امضاشده و قابل ارتقا، بررسی به‌روزرسانی از GitHub

            | Platform | Download |
            | --- | --- |
            | Windows x64 Portable | `DicodePing-3.0.0-pre.4-windows-x64-portable.zip` |
            | Windows x64 Installer | `DicodePing-3.0.0-pre.4-windows-x64-installer.exe` |
            | Linux x64 | `DicodePing-3.0.0-pre.4-linux-x64-portable.zip` |
            | macOS Intel | `DicodePing-3.0.0-pre.4-macos-x64-portable.zip` |
            | macOS Apple Silicon | `DicodePing-3.0.0-pre.4-macos-arm64-portable.zip` |
            | Android | APKهای Universal و تفکیک‌شدهٔ ABI |

            فایل‌های `SHA256SUMS-*` برای کنترل صحت دانلودها موجودند. این نسخه Pre-release است.
          files: artifacts/*
