name: Release 5.0.9 Stable
env:
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
jobs:
  fox-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - run: go test -race ./...
      working-directory: apps/fox-helper
    - name: Verify pinned Arman VPN core source
      run: |
        python scripts/verify-fox-upstream.py
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-latest
          rid: win-x64
          xray_asset: Xray-windows-64.zip
          xray_binary: xray.exe
          mihomo_asset: mihomo-windows-amd64-v1-v1.19.34.zip
          mihomo_binary: mihomo.exe
          mihomo_sha256: 703e325bfeee582f874b06d054eaae55ab7c194645d1835411685aafa85da5ea
          artifact: windows-x64
        - runner: ubuntu-latest
          rid: linux-x64
          xray_asset: Xray-linux-64.zip
          xray_binary: xray
          mihomo_asset: mihomo-linux-amd64-v1-v1.19.34.gz
          mihomo_binary: mihomo
          mihomo_sha256: 0c07340a01408d033dda4088ea2a4c1e4d82aeed7b2f84f7c046e93b6ff3290c
          artifact: linux-x64
        - runner: macos-15-intel
          rid: osx-x64
          xray_asset: Xray-macos-64.zip
          xray_binary: xray
          mihomo_asset: mihomo-darwin-amd64-v1-v1.19.34.gz
          mihomo_binary: mihomo
          mihomo_sha256: 84af3a9ffd4699e02f14b89859c58b4fc380f6a2135037c6e88e6822347ae657
          artifact: macos-x64
        - runner: macos-15
          rid: osx-arm64
          xray_asset: Xray-macos-arm64-v8a.zip
          xray_binary: xray
          mihomo_asset: mihomo-darwin-arm64-v1.19.34.gz
          mihomo_binary: mihomo
          mihomo_sha256: 1a7a20eca63fbbaec90137717465bfde488d0db2a3a79b8fadebf9b2545b6e4c
          artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore and build the independent desktop client
      run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=5.0.9
    - name: Render desktop layout on Linux
      if: runner.os == 'Linux'
      run: dotnet run --project apps/desktop/DicodeUi.Smoke -c Release
    - name: Run desktop regression tests on isolated Windows
      if: runner.os == 'Windows'
      env:
        POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
      run: |
        python scripts/check-pool-sources.py "$env:POOL_LIVE_FIXTURES"
        if ($LASTEXITCODE -ne 0) { throw 'Could not capture Telegram source fixtures' }
        dotnet test apps/desktop/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
    - name: Verify actual native Firefox WebChannel handoff
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        dotnet run --project apps/desktop/DicodeBrowser.Smoke -c Release
        if ($LASTEXITCODE -ne 0) { throw 'Native browser sign-in handoff failed' }
    - name: Verify the native Linux sign-in browser with WebKitGTK
      timeout-minutes: 6
      if: runner.os == 'Linux'
      env:
        GDK_BACKEND: x11
        WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb xauth
        bash scripts/prepare-browser-fixture.sh
        dotnet build apps/desktop/DicodeBrowser.Smoke -c Release
        timeout 80s xvfb-run -a dotnet apps/desktop/DicodeBrowser.Smoke/bin/Release/net10.0/DicodeBrowser.Smoke.dll --test-load-failure
        timeout 80s xvfb-run -a dotnet apps/desktop/DicodeBrowser.Smoke/bin/Release/net10.0/DicodeBrowser.Smoke.dll --test-success
    - name: Publish DicodePing desktop
      run: dotnet publish apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained
        true -p:Version=5.0.9 -o publish
    - name: Publish the standalone desktop updater
      shell: pwsh
      run: |
        dotnet publish apps/desktop/AmazTool/AmazTool.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o updater-publish
        if ($LASTEXITCODE -ne 0) { throw 'Updater publish failed' }
        $name = if ('${{ matrix.rid }}' -eq 'win-x64') { 'AmazTool.exe' } else { 'AmazTool' }
        Copy-Item "updater-publish/$name" "publish/$name"
        if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/$name" }
    - name: Exercise the published updater in an isolated installation
      shell: pwsh
      run: |
        $name = if ('${{ matrix.rid }}' -eq 'win-x64') { 'AmazTool.exe' } else { 'AmazTool' }
        python scripts/verify-desktop-updater.py --tool "publish/$name"
        if ($LASTEXITCODE -ne 0) { throw 'Native updater integration failed' }
    - name: Bundle verified Xray and Mihomo runtimes
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $url = "https://github.com/patterniha/Xray-core/releases/download/v26.11.24/${{ matrix.xray_asset }}"
        Invoke-WebRequest -Uri $url -OutFile xray.zip
        $release = gh api repos/patterniha/Xray-core/releases/tags/v26.11.24 | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw "Could not read the Xray release manifest" }
        $asset = $release.assets | Where-Object { $_.name -eq '${{ matrix.xray_asset }}' }
        if ($asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw "Xray release asset SHA-256 is unavailable" }
        $expected = $asset.digest.Substring(7)
        $actual = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
        if (-not $expected -or $actual -ne $expected) { throw "Xray SHA-256 verification failed" }
        Expand-Archive xray.zip -DestinationPath xray-runtime -Force
        if (-not (Test-Path "xray-runtime/${{ matrix.xray_binary }}")) { throw "Xray binary missing from archive" }
        $xrayDir = New-Item -ItemType Directory -Force publish/bin/xray
        $xray = Get-ChildItem xray-runtime -Recurse -File -Filter '${{ matrix.xray_binary }}' | Select-Object -First 1
        if ($null -eq $xray) { throw "Xray binary missing from archive" }
        Copy-Item $xray.FullName "$xrayDir/${{ matrix.xray_binary }}" -Force
        # Xray loads wintun beside its executable; keep the signed driver from
        # the checksum-verified upstream archive in every Windows package.
        if ('${{ matrix.rid }}' -eq 'win-x64') {
          $wintun = Get-ChildItem xray-runtime -Recurse -File -Filter 'wintun.dll' | Select-Object -First 1
          if ($null -eq $wintun) { throw 'wintun.dll missing from verified Xray archive' }
          Copy-Item $wintun.FullName "$xrayDir/wintun.dll" -Force
          Copy-Item $wintun.FullName 'publish/wintun.dll' -Force
          Copy-Item 'xray-runtime/LICENSE-Wintun' 'publish/bin/xray/LICENSE-Wintun' -Force
        }
        # Routing rules such as geosite:google need Xray's data files beside
        # the executable root. Without these files the main TUN core cannot
        # start, even though temporary speed-test cores appear to work.
        $dataDir = New-Item -ItemType Directory -Force publish/bin
        foreach ($dataName in @('geosite.dat', 'geoip.dat')) {
          $dataFile = Get-ChildItem xray-runtime -Recurse -File -Filter $dataName | Select-Object -First 1
          if ($null -eq $dataFile) { throw "$dataName missing from Xray archive" }
          Copy-Item $dataFile.FullName "$dataDir/$dataName" -Force
        }
        # Replace the archive defaults with the newest verified routing
        # database release so both the bundled runtime and Geo updater agree.
        $geoRelease = '202611172204'
        $geoHashes = @{ 'geoip.dat' = '304ac8a1cbcc8166e4f5a4f32955e4d0fb77a1bd713583e371b30ee27f3659d8'; 'geosite.dat' = '118d2e1358b892129be6aaf47e1f0c19d48944cf8f979980c65c7de423947883' }
        foreach ($dataName in @('geoip.dat', 'geosite.dat')) {
          $geoUrl = "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$geoRelease/$dataName"
          Invoke-WebRequest -Uri $geoUrl -OutFile "publish/bin/$dataName"
          $geoActual = (Get-FileHash "publish/bin/$dataName" -Algorithm SHA256).Hash.ToLower()
          if ($geoActual -ne $geoHashes[$dataName]) { throw "$dataName SHA-256 verification failed" }
        }
        $mihomoUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/${{ matrix.mihomo_asset }}"
        Invoke-WebRequest -Uri $mihomoUrl -OutFile mihomo.archive
        $mihomoActual = (Get-FileHash mihomo.archive -Algorithm SHA256).Hash.ToLower()
        if ($mihomoActual -ne '${{ matrix.mihomo_sha256 }}') { throw "Mihomo SHA-256 verification failed" }
        $mihomoDir = New-Item -ItemType Directory -Force publish/bin/mihomo
        if ('${{ matrix.mihomo_asset }}'.EndsWith('.zip')) {
          Expand-Archive mihomo.archive -DestinationPath mihomo-runtime -Force
          $mihomo = Get-ChildItem mihomo-runtime -Recurse -File | Where-Object { $_.Name -like 'mihomo*.exe' } | Select-Object -First 1
          if ($null -eq $mihomo) { throw "Mihomo binary missing from archive" }
          Copy-Item $mihomo.FullName "$mihomoDir/${{ matrix.mihomo_binary }}" -Force
        } else {
          $input = [IO.File]::OpenRead((Resolve-Path mihomo.archive))
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create((Join-Path $mihomoDir.FullName '${{ matrix.mihomo_binary }}'))
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
        }
        if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/xray/${{ matrix.xray_binary }}" }
        if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x "publish/bin/mihomo/${{ matrix.mihomo_binary }}" }
    - name: Build Fox helper from source
      run: python scripts/stage-fox.py --version 5.0.9 --rid ${{ matrix.rid }} --output publish/bin/fox
    - name: Exercise Linux TUN without a root GUI
      if: runner.os == 'Linux'
      run: |
        sudo setcap cap_net_admin,cap_net_raw,cap_net_bind_service=+ep publish/bin/xray/xray
        python scripts/verify-linux-tun.py --xray publish/bin/xray/xray
        sudo setcap -r publish/bin/xray/xray
    - name: Validate Serverless v62 with the packaged Xray
      run: python scripts/verify-serverless-runtime.py --xray publish/bin/xray/${{ matrix.xray_binary }}
    - name: Run runtime preservation and startup regression checks
      if: runner.os == 'Linux'
      run: dotnet test apps/desktop/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --filter FullyQualifiedName~Release505Tests
    - name: Bundle and execute independent sing-box engine
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/stage-singbox.py --release-build --rid ${{ matrix.rid }} --output publish/bin/sing_box
    - name: Exercise real traffic through independent sing-box
      run: python scripts/verify-independent-singbox.py --root publish
    - name: Bundle verified Aether and Psiphon helpers
      run: python scripts/stage-aether.py --rid ${{ matrix.rid }} --output publish/bin/aether
    - name: Exercise the Linux sing-box compatibility TUN
      if: runner.os == 'Linux'
      run: |
        sudo setcap cap_net_admin,cap_net_raw,cap_net_bind_service=+ep publish/bin/sing_box/sing-box
        python scripts/verify-linux-tun.py --singbox publish/bin/sing_box/sing-box
        sudo setcap -r publish/bin/sing_box/sing-box
    - name: Execute bundled cores in the ephemeral runner
      shell: pwsh
      run: |
        $versions = @{}
        $runtimePins = Get-Content scripts/runtime-pins-5.0.5.json -Raw | ConvertFrom-Json
        $checks = @(
          @{ name = 'fox'; path = 'publish/bin/fox/dicode-fox${{ matrix.rid == 'win-x64' && '.exe' || '' }}'; arg = '--version'; version = '5.0.9' },
          @{ name = 'xray'; path = 'publish/bin/xray/${{ matrix.xray_binary }}'; arg = 'version'; version = '26.11.24' },
          @{ name = 'aether'; path = 'publish/bin/aether/aether${{ matrix.rid == 'win-x64' && '.exe' || '' }}'; arg = '--version'; version = '2.4.0' },
          @{ name = 'mihomo'; path = 'publish/bin/mihomo/${{ matrix.mihomo_binary }}'; arg = '-v'; version = $runtimePins.mihomo_version }
        )
        foreach ($check in $checks) {
          $output = (& (Resolve-Path $check.path) $check.arg 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $output -notmatch [regex]::Escape($check.version)) { throw "Bundled $($check.name) has an incorrect version: $output" }
          $versions[$check.name] = @{ version = $check.version; sha256 = (Get-FileHash $check.path -Algorithm SHA256).Hash.ToLower(); output = $output.Trim() }
          Write-Host $output
        }
        $versions | ConvertTo-Json -Depth 4 | Set-Content publish/runtime-versions.json
    - name: Validate generated configurations with bundled native cores
      shell: pwsh
      run: |
        $env:DICODE_RUNTIME_TEST_ROOT = (Resolve-Path publish).Path
        dotnet test apps/desktop/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --filter "FullyQualifiedName~NativeRuntimeTests"
        if ($LASTEXITCODE -ne 0) { throw 'Generated configurations failed native core validation' }
    - name: Publish independent CLI with verified runtimes
      shell: pwsh
      run: |
        dotnet publish apps/desktop/DicodePing.Cli/DicodePing.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=5.0.9 -o cli-publish
        if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
        Copy-Item publish/bin cli-publish/bin -Recurse -Force
        Copy-Item publish/runtime-versions.json cli-publish/runtime-versions.json
        if (Test-Path publish/wintun.dll) { Copy-Item publish/wintun.dll cli-publish/wintun.dll }
        Copy-Item docs/CLI.md cli-publish/README.md
        Copy-Item LICENSE cli-publish/LICENSE
        $cli = (Resolve-Path ('cli-publish/dicodeping' + '${{ matrix.rid == 'win-x64' && '.exe' || '' }}')).Path
        & $cli --version
        if ($LASTEXITCODE -ne 0) { throw 'CLI version check failed' }
        & $cli --help
        if ($LASTEXITCODE -ne 0) { throw 'CLI help check failed' }
        if ('${{ matrix.rid }}' -ne 'win-x64') { chmod +x cli-publish/bin/fox/dicode-fox cli-publish/dicodeping cli-publish/bin/xray/xray cli-publish/bin/mihomo/mihomo cli-publish/bin/aether/aether cli-publish/bin/aether/pt/lyrebird cli-publish/bin/aether/pt/psiphon-tunnel-core }
        python scripts/package-desktop.py --root cli-publish --edition cli --platform ${{ matrix.artifact }}
        if ($LASTEXITCODE -ne 0) { throw 'CLI packaging failed' }
    - name: Exercise CLI with actual proxy traffic and cleanup
      if: runner.os == 'Linux'
      run: python scripts/verify-cli.py --root cli-publish
    - name: Exercise Windows native VLESS TUN with TLS and WebSocket
      if: runner.os == 'Windows'
      run: python scripts/verify-windows-v2ray.py --root cli-publish
    - name: Get verified AppImage tooling
      if: runner.os == 'Linux'
      run: |
        curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
        echo "e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03  $RUNNER_TEMP/appimagetool" | sha256sum --check
        chmod +x "$RUNNER_TEMP/appimagetool"
        echo "DICODE_APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
    - name: Archive and checksum
      run: python scripts/package-desktop.py --platform ${{ matrix.artifact }}
    - name: Verify the published graphical Linux client opens without root
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        python scripts/verify-linux-desktop.py
    - name: Build Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install innosetup --no-progress --yes
        & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion=5.0.9 .github\installer\DicodePing.iss
        $installer = Get-Item dist\DicodePing-5.0.9-windows-x64-installer.exe
        Add-Content dist\SHA256SUMS-windows-x64.txt ("{0}  {1}" -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower(), $installer.Name)
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: dist/*
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 27
    - uses: android-actions/setup-android@v4
    - name: Install SDK and NDK
      run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
    - name: Compute Android native payload cache key
      id: android-native-key
      run: |
        python scripts/test-android-native-cache-key.py
        python scripts/android-native-cache-key.py >> "$GITHUB_OUTPUT"
    - name: Restore pinned Android native payloads
      id: android-native
      uses: actions/cache/restore@v5
      with:
        path: |
          apps/android/app/libs
          apps/android/app/src/main/assets/fox
          apps/android/app/src/main/assets/singbox
          apps/android/app/src/main/assets/geo*.dat
          apps/android/app/src/main/assets/psiphon_servers.*
        key: ${{ steps.android-native-key.outputs.key }}
    - name: Build pinned hev TUN
      if: steps.android-native.outputs.cache-hit != 'true'
      env:
        NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      run: |
        git config --global http.version HTTP/1.1
        for attempt in 1 2 3 4; do
          if git clone --branch 2.4.1-P76 --depth 1 https://github.com/patterniha/PattNG.git native-upstream; then
            break
          fi
          rm -rf native-upstream
          test "$attempt" -lt 4
          sleep $((attempt * 5))
        done
        test "$(git -C native-upstream rev-parse HEAD)" = "dcff264e14aaea7c7a1acfc3793fb5c3bdb463f0"
        for attempt in 1 2 3 4; do
          if git -C native-upstream submodule update --init --recursive --depth 1; then
            break
          fi
          test "$attempt" -lt 4
          sleep $((attempt * 5))
        done
        git -C native-upstream/hev-socks5-tunnel fetch --depth 1 origin refs/tags/2.20.0
        git -C native-upstream/hev-socks5-tunnel checkout --detach FETCH_HEAD
        test "$(git -C native-upstream/hev-socks5-tunnel rev-parse HEAD)" = "75dbc1e9ace6c70d3d1b94df7c283efe1de7effc"
        git -C native-upstream/hev-socks5-tunnel submodule update --init --recursive --depth 1
        bash native-upstream/compile-hevtun.sh
        cp -r native-upstream/libs apps/android/app/
    - name: Bundle verified Android Aether and Psiphon helpers
      if: steps.android-native.outputs.cache-hit != 'true'
      run: |
        python scripts/stage-aether.py --android --output apps/android/app/libs
        bash native-upstream/fetch-psiphon-servers.sh
        cp native-upstream/V2rayNG/app/src/main/assets/psiphon_servers.* apps/android/app/src/main/assets/
    - name: Build Fox helper for all Android architectures
      if: steps.android-native.outputs.cache-hit != 'true'
      run: python scripts/stage-fox.py --version 5.0.9 --android --output apps/android/app/libs
    - name: Bundle independent sing-box for all Android architectures
      if: steps.android-native.outputs.cache-hit != 'true'
      run: python scripts/stage-singbox.py --release-build --android --output apps/android/app/libs
    - name: Build pinned Android runtime with strict HTTP probes
      if: steps.android-native.outputs.cache-hit != 'true'
      run: bash scripts/build-android-core.sh
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        DICODE_ANDROID_XRAY_WRAPPER: 99a179ae5bc2f98dc3a5f2d03ff185e0bb0eb58a
        DICODE_ANDROID_XRAY_CORE: 7131abd488e066687c77590dcc54697e5c9979ad
    - name: Save verified Android native payloads
      if: steps.android-native.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          apps/android/app/libs
          apps/android/app/src/main/assets/fox
          apps/android/app/src/main/assets/singbox
          apps/android/app/src/main/assets/geo*.dat
          apps/android/app/src/main/assets/psiphon_servers.*
        key: ${{ steps.android-native-key.outputs.key }}
    - name: Build signed installable APKs
      env:
        POOL_LIVE_FIXTURES: ${{ github.workspace }}/pool-live-fixtures
        DICODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        DICODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        DICODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      working-directory: apps/android
      run: |
        python3 ../../scripts/check-pool-sources.py "$POOL_LIVE_FIXTURES"
        echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > dicodeping-release.jks
        export DICODE_KEYSTORE_PATH="$PWD/dicodeping-release.jks"
        chmod +x gradlew
        ./gradlew testFdroidDebugUnitTest --no-daemon -PdicodeVersion=5.0.9
        ./gradlew assembleFdroidRelease --no-daemon -PdicodeVersion=5.0.9
        ./gradlew assembleTvRelease --no-daemon -PdicodeVersion=5.0.9
    - name: Stage APK and checksums
      run: |
        mkdir -p dist-android
        find apps/android/app/build/outputs/apk/{fdroid,tv}/release -type f -name '*.apk' -exec cp {} dist-android/ \;
        # The standalone TV edition is Universal; avoid publishing redundant
        # ABI variants that are not listed on the download page.
        find dist-android -name '*-tv-*.apk' ! -name '*-tv-universal.apk' ! -name '*-tv-arm64-v8a.apk' ! -name '*-tv-armeabi-v7a.apk' -delete
        # AGP may keep the internal compatibility flavor in the generated
        # filename; never expose that implementation detail in releases.
        for apk in dist-android/*-fdroid-*.apk; do
          [ -e "$apk" ] || continue
          clean="$(printf '%s' "$apk" | sed 's/-fdroid-/-/')"
          mv "$apk" "$clean"
        done
    - name: Canonicalize, align and sign the final APKs
      env:
        DICODE_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/dicodeping-release.jks
        DICODE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        DICODE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        DICODE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: python scripts/canonicalize-apks.py --version 5.0.9 --code 55000900 --count 8
    - name: Validate APK identity, signature and bundled native cores
      run: python scripts/verify-release-apks.py --version 5.0.9 --code 55000900 --tv-splits
    - uses: actions/upload-artifact@v7
      with:
        name: android
        path: dist-android/*
    timeout-minutes: 60
  install:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 29, apkAbi: x86_64, alternate: universal, target: default, baseline: "5.0.6 5.0.7 5.0.8"}
          - {api: 36, apkAbi: arm64-v8a, alternate: universal, target: google_apis, baseline: "5.0.5 5.0.6 5.0.7 5.0.8"}
          - {api: 36, apkAbi: universal, alternate: arm64-v8a, target: google_apis, baseline: "5.0.5 5.0.6 5.0.7 5.0.8"}
          - {api: 36, apkAbi: x86_64, alternate: universal, target: google_apis_ps16k, baseline: ""}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
      - uses: android-actions/setup-android@v4
      - name: Download published upgrade baselines
        run: |
          mkdir -p install-check
          for version in ${{ matrix.baseline }}; do
            curl --fail --location --retry 3 "https://github.com/mcodersir/dicodePing/releases/download/v$version/DicodePing-$version-${{ matrix.apkAbi }}.apk" --output "install-check/$version.apk"
          done
      - name: Prepare actual Android installer UI test
        if: matrix.baseline != ''
        run: |
          sdkmanager "build-tools;37.0.0" "platforms;android-36"
          bash scripts/build-apk-install-probe.sh
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test actual release installation, retained data and startup
        env:
          DICODE_INSTALL_TARGET: ${{ matrix.target }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 4096M
          disable-animations: true
          script: |
            python3 scripts/verify-android-installation.py --version 5.0.9 --code 55000900 --baselines ${{ matrix.baseline }} --candidate dist-android/DicodePing-5.0.9-${{ matrix.apkAbi }}.apk --alternate dist-android/DicodePing-5.0.9-${{ matrix.alternate }}.apk
            if [ "${{ matrix.api }}" = 36 ]; then for baseline in ${{ matrix.baseline }}; do python3 scripts/verify-apk-installer-ui.py --abi ${{ matrix.apkAbi }} --version 5.0.9 --baseline "install-check/$baseline.apk" && mv installer-ui-evidence "installer-ui-evidence-$baseline" || exit 1; done; fi
      - name: Preserve installation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-installation-${{ matrix.api }}-${{ matrix.apkAbi }}-${{ matrix.target }}
          path: |
            install-check/installation-results.json
            install-check/package-manager-logcat.txt
            installer-ui-evidence*/
  tv-install:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
      - uses: android-actions/setup-android@v4
      - run: sudo chmod a+rw /dev/kvm
      - name: Download signed TV upgrade baselines
        run: |
          mkdir -p install-check
          for version in 5.0.6 5.0.7 5.0.8; do
            curl --fail --location --retry 3 "https://github.com/mcodersir/dicodePing/releases/download/v$version/DicodePing-$version-tv-universal.apk" --output "install-check/$version.apk"
          done
      - name: Launch signed TV build on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 36 TV revision 1 crashes SystemUI before our APK is installed
          # (VectorDrawable resource inflation), leaving every app without focus.
          # Use the stable Android 14 TV image for the signed remote-control gate.
          api-level: 34
          arch: x86
          target: android-tv
          profile: tv_1080p
          # Use GLES in the headless TV guest after its observed restart.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          ram-size: 4096M
          disable-animations: true
          script: python3 scripts/verify-android-installation.py --package ir.dicode.ping.tv --remote --no-data-fixture --version 5.0.9 --code 55000900 --baselines 5.0.6 5.0.7 5.0.8 --candidate dist-android/DicodePing-5.0.9-tv-universal.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tv-installation-evidence
          path: install-check/
  router:
    name: RouterOS beta image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, asset: x86_64}
          - {arch: arm64, asset: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the RouterOS-compatible image
        run: docker buildx build --load --platform linux/${{ matrix.arch }} --file apps/router/Dockerfile --tag dicodeping-router:5.0.9 .
      - name: Check executables and startup in the target architecture
        run: |
          image=dicodeping-router:5.0.9
          platform=linux/${{ matrix.arch }}
          docker run --rm --platform "$platform" --entrypoint dicode-fox "$image" --version | grep -F '5.0.9'
          docker run --rm --platform "$platform" --entrypoint sing-box "$image" version | grep -F '1.15.0-alpha.15'
          docker run -d --name router-startup --platform "$platform" "$image"
          trap 'docker rm -f router-startup >/dev/null' EXIT
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' router-startup)" = true
          test -z "$(docker logs router-startup 2>&1)"
      - name: Export and checksum the Docker archive
        run: |
          mkdir router-dist
          name=DicodePing-5.0.9-routeros-${{ matrix.asset }}.tar
          docker save --output "router-dist/$name" dicodeping-router:5.0.9
          cd router-dist
          sha256sum "$name" > SHA256SUMS-routeros-${{ matrix.asset }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: routeros-${{ matrix.asset }}
          path: router-dist/*
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs:
    - fox-regression
    - desktop
    - android
    - install
    - tv-install
    - router
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.15"
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        pattern: '{android,windows-x64,linux-x64,macos-x64,macos-arm64,routeros-x86_64,routeros-arm64}'
        merge-multiple: true
    - name: Confirm this is still the release branch revision
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/release-5.0.9" --jq .object.sha)
        test "$actual" = "$GITHUB_SHA"
    - name: Stage only signed APKs and checksummed desktop packages
      run: |
        python scripts/stage-release-assets.py artifacts web/index.html 5.0.9
    - uses: softprops/action-gh-release@v2
      id: draft_release
      with:
        tag_name: v5.0.9
        target_commitish: ${{ github.sha }}
        name: DicodePing 5.0.9 — Stable
        draft: true
        prerelease: false
        make_latest: false
        generate_release_notes: false
        body_path: docs/RELEASE-5.0.9.md
        files: release-assets/*
    - name: Verify every uploaded package before publishing the stable release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }} > release-metadata.json
        gh release download v5.0.9 --repo "${{ github.repository }}" --pattern 'SHA256SUMS-*.txt' --dir release-checksums --clobber
        python - <<'PYVERIFY'
        import json, pathlib, re
        release = json.loads(pathlib.Path('release-metadata.json').read_text())
        assets = {a['name']: a for a in release['assets']}
        expected = {'DicodePing-5.0.9-' + suffix for suffix in re.findall('data-asset="([^"]+)"', pathlib.Path('web/index.html').read_text())}
        assert len(expected) == 23 and len(assets) == 34 and expected <= assets.keys()
        checks = {}
        for file in pathlib.Path('release-checksums').glob('SHA256SUMS-*.txt'):
            for line in file.read_text(encoding='utf-8-sig').splitlines():
                match = re.fullmatch(r'([0-9a-fA-F]{64})\s+\*?(.+)', line.strip())
                assert match, (file, line)
                checks[match[2]] = match[1].lower()
        assert set(checks) == expected
        for name in expected:
            assert assets[name]['size'] > 0 and assets[name]['digest'] == 'sha256:' + checks[name], name
        print('All 23 packages and 11 checksum files verified; safe to publish.')
        PYVERIFY
        gh api --method PATCH repos/${{ github.repository }}/releases/${{ steps.draft_release.outputs.id }} -F draft=false -f make_latest=true > /dev/null
  website:
    needs: publish
    uses: ./.github/workflows/website.yml
    with:
      release_tag: v5.0.9
      source_sha: ${{ github.sha }}
on:
  push:
    branches: [codex/release-5.0.9]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after desktop and Android release checks pass
        type: boolean
        default: false
