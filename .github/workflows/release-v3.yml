name: dicodePing V3 pre-release

on:
  push:
    tags:
      - "v3.*-pre.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DOTNET_VERSION: "9.0.x"
  RELEASE_VERSION: "3.0.0-pre.4"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate V3 source tree
        run: |
          python tools/validate_v3.py
          python tools/validate_corehost_api_surface.py
          python dicodePing_android/tools/validate_project.py
          python tools/validate_android_source_references.py
          python tools/validate_android_release.py
          python tools/validate_workflow_yaml.py
          python -m pytest -q tests/test_release.py
      - name: Compile CoreHost against vendored ServiceLib
        run: dotnet build corehost/dicodePing.CoreHost.csproj -c Release

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m tools.build_windows --skip-install
      - run: python tools/smoke_corehost.py build/engine/win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release/dicodePing-v3.0.0-pre.4-windows-x64.exe
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m tools.build_linux --skip-install
      - run: python tools/smoke_corehost.py build/engine/linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: release/dicodePing-v3.0.0-pre.4-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rid: osx-arm64
          - runner: macos-15-intel
            arch: x86_64
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: python -m pip install -r requirements-build.txt
      - run: python -m tools.build_macos --skip-install
      - name: Smoke-test CoreHost
        run: python tools/smoke_corehost.py "build/engine/${{ matrix.rid }}"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: release/dicodePing-v3.0.0-pre.4-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Materialize Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dicodeping-release.jks"
      - name: Build signed universal APK
        working-directory: dicodePing_android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dicodeping-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash build_apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-universal
          path: dicodePing_android/release/dicodePing-v3.0.0-pre.4-android.apk
          if-no-files-found: error

  prerelease:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate tag and assets
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v3.0.0-pre.4" || { echo "Expected tag v3.0.0-pre.4, got $GITHUB_REF_NAME" >&2; exit 1; }
          test -f release-assets/dicodePing-v3.0.0-pre.4-windows-x64.exe
          test -f release-assets/dicodePing-v3.0.0-pre.4-linux-x86_64.tar.gz
          test -f release-assets/dicodePing-v3.0.0-pre.4-macos-arm64.dmg
          test -f release-assets/dicodePing-v3.0.0-pre.4-macos-x86_64.dmg
          test -f release-assets/dicodePing-v3.0.0-pre.4-android.apk
          curl --fail --location --retry 4 --retry-all-errors \
            --output release-assets/sing-box-1.13.12-source.tar.gz \
            "https://github.com/SagerNet/sing-box/archive/refs/tags/v1.13.12.tar.gz"
          cp THIRD_PARTY_NOTICES.md LICENSE release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Create or refresh GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Refreshing existing pre-release $GITHUB_REF_NAME"
            gh release edit "$GITHUB_REF_NAME" \
              --prerelease \
              --draft=false \
              --verify-tag \
              --title "dicodePing 3.0.0-pre.4" \
              --notes-file docs/releases/v3.0.0-pre.4.md
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            echo "Creating pre-release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --prerelease \
              --verify-tag \
              --title "dicodePing 3.0.0-pre.4" \
              --notes-file docs/releases/v3.0.0-pre.4.md
          fi
