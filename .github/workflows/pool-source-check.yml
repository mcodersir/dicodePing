name: Inspect public pool sources
on:
  push:
    branches: ['codex/release-*']
    paths: ['.github/workflows/pool-source-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Telegram response structure and dates
        run: |
          python3 - <<'PY'
          import concurrent.futures, re, urllib.request, datetime
          def inspect(channel):
              req = urllib.request.Request('https://t.me/s/' + channel, headers={'User-Agent': 'DicodePing/3.9.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  html = response.read(2 * 1024 * 1024).decode()
                  dated = []
                  for post in html.split('<div class="tgme_widget_message_wrap')[1:]:
                      stamp = re.search(r'datetime="([^"]+)"', post)
                      count = len(re.findall(r'(?:vless|vmess|trojan|ss)://', post))
                      if stamp and count: dated.append((stamp[1], count))
                  if dated: print(channel, 'last link posts=', dated[-2:], flush=True)
                  return len(dated)
          def safe(channel):
              try: return inspect(channel)
              except Exception as e: print(channel, type(e).__name__, flush=True); return 0
          with urllib.request.urlopen('https://raw.githubusercontent.com/mcodersir/DicodeConfigChecker/refs/heads/main/channels.txt') as r:
              channels = [x.strip().removeprefix('https://t.me/').removeprefix('http://t.me/').removeprefix('t.me/').removeprefix('@') for x in r.read().decode().splitlines()]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              print('channels with dated links=', sum(x > 0 for x in pool.map(safe, channels)), flush=True)
          PY
