name: V5 native OAuth admission probe
on:
  push:
    branches: [codex/fox-v5-admission]
permissions:
  contents: read
jobs:
  origin-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: false
      - run: go test -v -timeout 120s -run '^TestV5LiveOAuthAdmission$' ./internal/fxa
        working-directory: apps/fox-helper
