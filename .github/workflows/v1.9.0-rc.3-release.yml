name: Release v1.9.0-rc.3

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v1.9.0-rc.3.md
      - .github/workflows/v1.9.0-rc.3-release.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release-v1.9.0-rc.3
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python tools/verify_version.py --tag v1.9.0-rc.3
          python -m pytest -q
          python tools/quality_gate.py
          python dicodePing_android/tools/validate_project.py
          curl --fail --location --retry 4 --output assets/default-subscription.txt "https://raw.githubusercontent.com/mcodersir/DicodeConfigChecker/refs/heads/main/sub.txt"
      - if: matrix.name == 'windows'
        shell: pwsh
        run: |
          python tools/capture_ui_matrix.py
          python tools/build_windows.py --skip-install
      - if: matrix.name == 'linux'
        run: python tools/build_linux.py --skip-install
      - if: startsWith(matrix.name, 'macos')
        run: python tools/build_macos.py --skip-install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/dicodePing-v1.9.0-rc.3-*
          if-no-files-found: error
      - if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots/v1.9.0-rc.3

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dicodePing_android
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/dicodePing_android/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          target="local-maven/ir/dicode/local/libv2ray/26.7.11/libv2ray-26.7.11.aar"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 4 --output "$target" "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.11/libv2ray.aar"
          echo "0c79bb52dc4329aaa266601e56ce4f0cc756b43f97a43dccd08d4a4bfc9aa352  $target" | sha256sum --check --strict
          chmod +x gradlew
          ./gradlew --no-daemon lint test assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/dicodePing-v1.9.0-rc.3-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dicodePing_android/release/dicodePing-v1.9.0-rc.3-android.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir release-assets
          find artifacts/windows artifacts/linux artifacts/macos-arm64 artifacts/macos-x64 artifacts/android -maxdepth 2 -type f -exec cp {} release-assets/ \;
          cp assets/core-manifest.json docs/releases/v1.9.0-rc.3.md CHANGELOG.md THIRD_PARTY_NOTICES.md release-assets/
          cp docs/releases/v1.9.0-rc.3.md release-assets/RELEASE_NOTES.md
          python tools/generate_sbom.py
          cp artifacts/SBOM.spdx.json release-assets/SBOM.spdx.json
          git archive --format=zip --output=release-assets/source.zip HEAD
          printf '{"repository":"%s","commit":"%s","runId":"%s","workflow":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" > release-assets/provenance.json
          (cd release-assets && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0-rc.3
          target_commitish: main
          name: dicodePing v1.9.0-rc.3
          body_path: docs/releases/v1.9.0-rc.3.md
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*
