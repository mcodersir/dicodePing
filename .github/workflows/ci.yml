name: V3 CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/validate_v3.py
      - run: python tools/validate_corehost_api_surface.py
      - run: python dicodePing_android/tools/validate_project.py
      - run: python tools/validate_android_source_references.py
      - run: python tools/validate_android_release.py
      - run: python tools/validate_workflow_yaml.py
      - run: python -m pytest -q tests/test_release.py
      - run: dotnet build corehost/dicodePing.CoreHost.csproj -c Release
