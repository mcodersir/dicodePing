name: Verify

on:
  push:
    branches: [main, 'codex/release-*', 'codex/desktop-*']
  pull_request:

jobs:
  fox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - run: go test -race -timeout 60s ./...
        working-directory: apps/fox-helper

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=4.9.3

      - name: Build independent CLI
        run: |
          dotnet build apps/desktop/DicodePing.Cli/DicodePing.Cli.csproj -c Release
          dotnet run --project apps/desktop/DicodePing.Cli -c Release --no-build -- --help
      - name: Render desktop layout in both directions and themes
        run: dotnet run --project apps/desktop/DicodeUi.Smoke -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-checks
          path: desktop-qa/*.png

  desktop-windows-isolated:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify Windows Fox socket interface binding
        run: go test -timeout 60s ./...
        working-directory: apps/fox-helper
      - name: Build and test in an ephemeral Windows runner
        shell: pwsh
        run: |
          dotnet test apps/desktop/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop regression tests failed' }
          dotnet publish apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=4.9.3 -o isolated-publish
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed' }
          if (-not (Test-Path isolated-publish/DicodePing.exe)) { throw 'Desktop executable was not published' }
          $manifest = Get-Content apps/desktop/v2rayN.Desktop/app.manifest -Raw
          if ($manifest -notmatch 'requireAdministrator') { throw 'TUN elevation manifest is missing' }
          if ((Get-Item isolated-publish/DicodePing.exe).Length -lt 1MB) { throw 'Published executable is unexpectedly small' }

  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release version and Android UI source
        run: |
          grep -q 'versionName.*4.9.3' apps/android/app/build.gradle.kts
          test -f apps/android/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-download-page.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: website-ui-checks
          path: web-qa-*.png
