name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build apps/desktop/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -p:Version=3.0.0-pre.12

  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release version and Android UI source
        run: |
          grep -q '3.0.0-pre.12' apps/android/app/build.gradle.kts
          test -f apps/android/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt
