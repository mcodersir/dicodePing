name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Source-quality only.  Build and release are handled by per-release
# workflow in .github/workflows/release.yml, triggered by the current release tag.
jobs:
  source-quality:
    name: Python and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install minimal Qt Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify synchronized version
        run: python tools/verify_version.py --tag v3.0.0-pre.1
      - name: Validate v3.0.0 pre-release invariants
        run: python tools/validate_v300_prerelease.py
      - name: Compile Python
        run: python -m compileall -q app_v3.py dicodeping tools tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Security quality gate
        run: python tools/quality_gate.py
      - name: Generate SBOM
        run: python tools/generate_sbom.py
      - uses: actions/upload-artifact@v7
        with:
          name: source-sbom
          path: artifacts/SBOM.spdx.json
          if-no-files-found: error
