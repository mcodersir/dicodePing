name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "21 3 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, java-kotlin, csharp]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python for deterministic Android resource preparation
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"

      - name: Verify pinned Python runtime
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Download pinned Android Xray core
        if: matrix.language == 'java-kotlin'
        working-directory: dicodePing_android
        shell: bash
        run: |
          set -euo pipefail
          target="local-maven/ir/dicode/local/libv2ray/26.7.11/libv2ray-26.7.11.aar"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$target" \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.11/libv2ray.aar"
          echo "0c79bb52dc4329aaa266601e56ce4f0cc756b43f97a43dccd08d4a4bfc9aa352  $target" | sha256sum --check --strict

      - name: Prepare pinned bundled Android fonts
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_vazirmatn.py --android
          for font in regular medium bold; do
            file="dicodePing_android/app/src/main/res/font/vazirmatn_${font}.ttf"
            test -s "$file"
          done

      - name: Build Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: dicodePing_android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PdicodePing.codeql=true assembleDebug

      - name: Build desktop CoreHost for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build corehost/dicodePing.CoreHost.csproj -c Release

      - uses: github/codeql-action/analyze@v4
