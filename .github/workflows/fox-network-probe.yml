name: Fox 4.9.991 native control-plane network probe
on:
  push:
    branches: [codex/fox-991-network-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: false
      - continue-on-error: true
        name: Probe Mozilla using the packaged native transport without account credentials
        working-directory: apps/fox-helper
        run: |
          cat > internal/controlplane/live_native_probe_test.go <<'GO'
          package controlplane
          import ("context";"testing";"net/http";"strings";"time";"io")
          func TestLiveNativeTransport(t *testing.T) {
            for _, mode := range []string{"http1", "http2"} {
              ctx,cancel:=context.WithTimeout(context.Background(),15*time.Second)
              req,_:=http.NewRequestWithContext(ctx,"POST","https://api.accounts.firefox.com/v1/oauth/token",strings.NewReader(`{"client_id":"5882386c6d801776","grant_type":"refresh_token","refresh_token":"abababababababababababababababababababababababababababababababab"}`))
              req.Header.Set("Content-Type","application/json"); ApplyFirefoxHeaders(req)
              var resp *http.Response; var err error
              if mode=="http1" {resp,err=Do(req)} else {resp,err=DoDirectHTTP2(req)}
              if err!=nil {t.Errorf("%s could not reach Mozilla: %v",mode,err)} else {
                body,_:=io.ReadAll(io.LimitReader(resp.Body,1024));resp.Body.Close()
                t.Logf("%s status=%d protocol=%s response=%s",mode,resp.StatusCode,resp.Proto,string(body))
                if mode=="http2" && (resp.ProtoMajor!=2 || (resp.StatusCode!=401 && resp.StatusCode!=400 && resp.StatusCode!=403)) {t.Errorf("HTTP/2 did not reach expected FxA invalid-token response")}
              }
              cancel()
            }
          }
          GO
          go test ./internal/controlplane -run '^TestLiveNativeTransport$' -v
      - name: Run the whole native refresh and challenge recovery without real credentials
        working-directory: apps/fox-helper
        run: |
          cat > internal/fxa/live_native_probe_test.go <<'GO'
          package fxa
          import ("context";"testing";"time";"errors")
          func TestLiveFullNativeRefresh(t *testing.T) {
            ctx,cancel:=context.WithTimeout(context.Background(),110*time.Second);defer cancel()
            _,err:=fxaRefreshToken(ctx,"abababababababababababababababababababababababababababababababab")
            var apiError *fxaAPIError
            if !errors.As(err,&apiError) {t.Fatalf("full native refresh could not reach FxA rejection: %v",err)}
            t.Logf("FxA reached: status=%d errno=%d body=%s",apiError.Status,apiError.Errno,apiError.Body)
            if apiError.Status!=400 && apiError.Status!=401 && apiError.Status!=403 {t.Fatalf("unexpected API rejection: %v",err)}
          }
          GO
          go test ./internal/fxa -run '^TestLiveFullNativeRefresh$' -v
      - name: Compare the platform TLS HTTP2 route without credentials
        working-directory: apps/fox-helper
        run: |
          cat > internal/controlplane/live_platform_probe_test.go <<'GO'
          package controlplane
          import ("context";"testing";"net/http";"strings";"time";"io")
          func TestLivePlatformTLS(t *testing.T) {
            transport:=http.DefaultTransport.(*http.Transport).Clone();transport.Proxy=nil;transport.ForceAttemptHTTP2=true
            client:=&http.Client{Transport:transport,Timeout:15*time.Second,Jar:client.Jar}
            for _, enc:=range []string{"identity","gzip","gzip, deflate, br, zstd"} {
              ctx,cancel:=context.WithTimeout(context.Background(),15*time.Second)
              req,_:=http.NewRequestWithContext(ctx,"POST","https://api.accounts.firefox.com/v1/oauth/token",strings.NewReader(`{"client_id":"5882386c6d801776","grant_type":"refresh_token","refresh_token":"abababababababababababababababababababababababababababababababab"}`))
              req.Header.Set("Content-Type","application/json");ApplyFirefoxHeaders(req);req.Header.Set("Accept-Encoding",enc)
              resp,err:=client.Do(req)
              if err!=nil {t.Logf("platform TLS encoding=%s err=%v",enc,err)} else {body,_:=io.ReadAll(io.LimitReader(resp.Body,1024));resp.Body.Close();t.Logf("platform TLS encoding=%s status=%d protocol=%s body=%s",enc,resp.StatusCode,resp.Proto,string(body))}
              cancel()
            }
          }
          GO
          go test ./internal/controlplane -run '^TestLivePlatformTLS$' -v
      - name: Probe the native session grant with a nonexistent session
        working-directory: apps/fox-helper
        run: |
          cat > internal/fxa/live_native_session_test.go <<'GO'
          package fxa
          import ("context";"testing";"time";"errors";"strings")
          func TestLiveFullNativeSession(t *testing.T) {
            ctx,cancel:=context.WithTimeout(context.Background(),110*time.Second);defer cancel()
            _,err:=OAuthTokenDirect(ctx,strings.Repeat("ab",32))
            var apiError *fxaAPIError
            if !errors.As(err,&apiError) {t.Fatalf("full native session could not reach FxA rejection: %v",err)}
            t.Logf("FxA session reached: status=%d errno=%d body=%s",apiError.Status,apiError.Errno,apiError.Body)
            if apiError.Status!=400 && apiError.Status!=401 && apiError.Status!=403 {t.Fatalf("unexpected API rejection: %v",err)}
          }
          GO
          go test ./internal/fxa -run '^TestLiveFullNativeSession$' -v
      - name: Compare documented refresh grant encodings without credentials
        working-directory: apps/fox-helper
        run: |
          cat > internal/controlplane/live_refresh_shapes_test.go <<'GO'
          package controlplane
          import ("context";"testing";"net/http";"strings";"time";"io";"encoding/json";"net/url")
          func TestLiveRefreshShapes(t *testing.T) {
            transport:=http.DefaultTransport.(*http.Transport).Clone();transport.Proxy=nil;transport.ForceAttemptHTTP2=true
            client:=&http.Client{Transport:transport,Timeout:12*time.Second}
            for _,host:=range []string{"https://api.accounts.firefox.com/v1/oauth/token","https://oauth.accounts.firefox.com/v1/token"} {
              for _,form:=range []bool{false,true} {for _,scope:=range []bool{false,true} {
                ctx,cancel:=context.WithTimeout(context.Background(),12*time.Second)
                values:=map[string]string{"client_id":"5882386c6d801776","grant_type":"refresh_token","refresh_token":strings.Repeat("ab",32)}
                if scope {values["scope"]="profile https://identity.mozilla.com/apps/vpn"}
                data,_:=json.Marshal(values);ct:="application/json"
                if form {v:=url.Values{};for k,x:=range values {v.Set(k,x)};data=[]byte(v.Encode());ct="application/x-www-form-urlencoded"}
                req,_:=http.NewRequestWithContext(ctx,"POST",host,strings.NewReader(string(data)));req.Header.Set("Content-Type",ct);ApplyFirefoxHeaders(req)
                resp,err:=client.Do(req)
                if err!=nil {t.Logf("shape host=%s form=%v scope=%v err=%v",host,form,scope,err)} else {body,_:=io.ReadAll(io.LimitReader(resp.Body,1000));resp.Body.Close();t.Logf("shape host=%s form=%v scope=%v status=%d body=%s",host,form,scope,resp.StatusCode,string(body))}
                cancel()
              }}
            }
          }
          GO
          go test ./internal/controlplane -run '^TestLiveRefreshShapes$' -v
